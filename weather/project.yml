name: EVAWeather
options:
  bundleIdPrefix: de.egis-datenbankarchiv
  deploymentTarget:
    iOS: "17.0"
packages:
  EVAGemeinsam:
    path: ../_gemeinsam
targets:
  EVAWeather:
    type: application
    platform: iOS
    sources: [Quellen]
    dependencies:
      - package: EVAGemeinsam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.egis-datenbankarchiv.eva-weather
        PRODUCT_NAME: EVAWeather
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: EVA WEATHER
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Die Kamera liest den Anmelde-Code vom Rechner."
        SWIFT_VERSION: "5.0"
